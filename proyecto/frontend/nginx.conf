server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sirve la SPA de React: cualquier ruta no encontrada cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: todo lo que llegue a /api/* se redirige al backend,
    # quitando el prefijo /api antes de reenviarlo (igual que el proxy
    # de Vite en desarrollo, para que el código de la app no cambie).
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Compresión básica para los estáticos generados por Vite
    gzip on;
    gzip_types text/css application/javascript application/json;
}